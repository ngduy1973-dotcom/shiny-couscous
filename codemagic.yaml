workflows:
  build-ipa:
    name: Build IPA TinNhan
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build without signing
        script: |
          xcodebuild \
            -project TinNhanWebApp.xcodeproj \
            -scheme TinNhanWebApp \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TinNhanWebApp.app Payload/
          zip -r TinNhan.ipa Payload
    artifacts:
      - TinNhan.ipa
