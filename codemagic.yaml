workflows:
  version: 2
  build-ios:
    name: Build iOS IPA (TinNhan)
    environment:
      xcode: 15.0
      xcconfig:
        BUNDLE_ID: com.tinnhan.webapp
    scripts:
      - name: Cài XcodeGen
        script: |
          brew install xcodegen
      - name: Tạo project từ project.yml
        script: |
          xcodegen generate
      - name: Build không ký tên
        script: |
          xcodebuild \
            -scheme TinNhanWebApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
      - name: Đóng gói thành .ipa
        script: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/TinNhanWebApp.app Payload/
          zip -r TinNhan.ipa Payload
    artifacts:
      - build/TinNhan.ipa
